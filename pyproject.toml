[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-brain-pydantic-public"
version = "0.1.0"
description = "Evidence-bound sales assistant reference service"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "FivePointAIStudio"}]
readme = "README.md"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-ai-slim[openai,mcp]==2.68.0",
  "jsonschema>=4.20,<5",
]

[project.optional-dependencies]
test = ["pytest>=9,<10", "pytest-asyncio>=1.5,<2", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
